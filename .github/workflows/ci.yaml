name: CI Pipeline

on: 
  push:
    branches: [ main ]

jobs:
 
  dvc_pipeline_run:

    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      mlflow_tracking_uri: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps: 
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with: 
        python-version: "3.11"

    - name: Install dependencies
      run: | 
        pip install -r requirements.txt
        pip install dvc[s3] mlflow
        pip install pytest

    - name: Pull data from DVC
      run: dvc pull

    - name: Run DVC pipeline
      run: dvc repro
    
    - name: test_model_loading
      run: pytest scripts/tests/test_model_loading.py

    - name: test_model_performance
      run: pytest scripts/tests/test_model_performance.py

  
    - name: Start FastAPI server
      run: |
          nohup uvicorn backend.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &

          echo "Waiting for server to start..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/docs > /dev/null; then
              echo "Server is up!"
              break
            fi
            sleep 3
          done

    - name: Test API endpoints
      run: pytest scripts/tests/test_backend_api.py

    - name: Show server logs on failure
      if: failure()
      run: cat server.log

    - name: login to aws ecr
      if: success()
      run: |
        aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
        aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
        aws configure set default.region $AWS_DEFAULT_REGION
        aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 842990484831.dkr.ecr.ap-south-1.amazonaws.com

    - name: build docker image
      if: success()
      run: |
       docker build -t bobby-yt-comment-analyser .
    
    - name: tag docker image
      if: success()
      run: |
        docker tag bobby-yt-comment-analyser:latest 842990484831.dkr.ecr.ap-south-1.amazonaws.com/bobby-yt-comment-analyser:latest

    - name: push docker image to ecr
      if: success()
      run: |
        docker push 842990484831.dkr.ecr.ap-south-1.amazonaws.com/bobby-yt-comment-analyser:latest
    
    - name : deploy on ec2
      if: success()
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws configure set default.region ${{ secrets.AWS_REGION }}

            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 842990484831.dkr.ecr.ap-south-1.amazonaws.com
            sudo docker pull 842990484831.dkr.ecr.ap-south-1.amazonaws.com/bobby-yt-comment-analyser:latest
            sudo docker stop bobby-yt-comment-analyser || true
            sudo docker rm bobby-yt-comment-analyser || true
            sudo docker run -d -p 80:8000 --name bobby-yt-comment-analyser 842990484831.dkr.ecr.ap-south-1.amazonaws.com/bobby-yt-comment-analyser:latest

    - name: push to  dvc
      run : dvc push

    - name: configure git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Commit and push changes
      if: ${{github.actor != 'github-actions[bot]'}}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git add .
        git commit -m "Update DVC pipeline results [skip ci]" || echo "No changes to commit"
        git push origin ${{github.ref_name}}
